<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-labelledby="t d">
<title id="t">ReData</title><desc id="d">A bar chart whose bars rise and fall.</desc>
<style>.pulse{animation:pulse 1.8s ease-out infinite}@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}.g0{animation:g0 2.6s ease-in-out -0s infinite alternate}@keyframes g0{to{transform:scaleY(0.45)}}.g1{animation:g1 3.1s ease-in-out -0.4s infinite alternate}@keyframes g1{to{transform:scaleY(0.6)}}.g2{animation:g2 2.2s ease-in-out -0.2s infinite alternate}@keyframes g2{to{transform:scaleY(1.5)}}.g3{animation:g3 3.4s ease-in-out -0.7s infinite alternate}@keyframes g3{to{transform:scaleY(0.55)}}.g4{animation:g4 2.8s ease-in-out -0.1s infinite alternate}@keyframes g4{to{transform:scaleY(1.25)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
