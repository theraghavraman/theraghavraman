<title id="t">SPACE</title><desc id="d">A planet with two moons in orbit and twinkling stars.</desc>
<style>.pulse{animation:pulse 1.8s ease-out infinite}@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}.orb{animation:orb 7s linear infinite}@keyframes orb{to{transform:rotate(360deg)}}.orb2{animation:orb 12s linear infinite reverse}.s0{animation:tw 2.4s ease-in-out -0s infinite alternate}.s1{animation:tw 2.4s ease-in-out -0.6s infinite alternate}.s2{animation:tw 2.4s ease-in-out -1.1s infinite alternate}.s3{animation:tw 2.4s ease-in-out -0.3s infinite alternate}.s4{animation:tw 2.4s ease-in-out -1.5s infinite alternate}.s5{animation:tw 2.4s ease-in-out -0.9s infinite alternate}@keyframes tw{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
